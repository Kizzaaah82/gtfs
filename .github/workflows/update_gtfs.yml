name: Update Windsor GTFS Feed

on:
  schedule:
    - cron: '0 6 * * *'  # UTC 6:00 = 2am EDT
  workflow_dispatch:      # allows manual runs

jobs:
  update-gtfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download GTFS ZIP
        run: |
          curl -L -o windsor-gtfs.zip https://opendata.citywindsor.ca/Uploads/google_transit.zip

      - name: Unzip GTFS files
        run: |
          mkdir -p gtfs/windsor
          unzip -o windsor-gtfs.zip -d gtfs/windsor

      - name: Commit updated GTFS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gtfs/windsor/*.txt
          git diff --quiet && echo "No changes, skipping commit." || (git commit -m "ci: update Windsor GTFS feed (automated)" && git push)
