name: Update Windsor GTFS Feed

on:
  schedule:
    - cron: '0 6 * * 0,4'  # Sunday (0) & Thursday (4) at 2am EDT (UTC 6)
  workflow_dispatch:

jobs:
  update-gtfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Download GTFS ZIP
        run: |
          curl -L -o windsor-gtfs.zip https://opendata.citywindsor.ca/Uploads/google_transit.zip

      - name: Delete existing GTFS text files (but keep workflow folder)
        run: |
          rm -f agency.txt calendar.txt calendar_dates.txt fare_attributes.txt fare_rules.txt feed_info.txt last_sync.txt routes.txt shapes.txt stop_times.txt stops.txt trips.txt

      - name: Unzip GTFS files properly
        run: |
          unzip -o windsor-gtfs.zip -d temp_gtfs
          cp -f temp_gtfs/*.txt .
          rm -rf temp_gtfs


      - name: Delete the ZIP file
        run: |
          rm -f windsor-gtfs.zip

      - name: Add last sync timestamp
        run: |
          echo "Last GTFS sync: $(date -u)" > last_sync.txt

      - name: Force-commit fresh GTFS snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🔥 Forced full GTFS snapshot $(date -u)" || echo "No changes to commit"
          git push
